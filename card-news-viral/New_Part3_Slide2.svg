<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&amp;family=Outfit:wght@400;700;900&amp;display=swap');
      .brand-mark { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #c5a880; font-size: 24px; letter-spacing: 0.15em; }
      .card-title { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #ffffff; font-size: 34px; line-height: 1.45; letter-spacing: -0.01em; }
      .card-subtitle { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #c5a880; font-size: 26px; letter-spacing: -0.01em; }
      .card-body { font-family: 'Outfit', sans-serif; font-weight: 500; fill: #e2e8f0; font-size: 26px; line-height: 1.65; }
      .footer-text { font-family: 'Noto Sans KR', 'Outfit', sans-serif; font-weight: 700; fill: #cbd5e1; font-size: 22px; }
      .overlay { fill: rgba(7, 10, 19, 0.88); }
      .box { fill: none; stroke: rgba(197, 168, 128, 0.35); stroke-width: 1.5; rx: 20px; }
      .bullet-dot { fill: #c5a880; }
    </style>
  </defs>

  <!-- Background Base64 Image -->
  <image href="file:///C:/Users/user/OneDrive/%EB%B0%94%ED%83%95%20%ED%99%94%EB%A9%B4/marketing_asset_writing_student.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
  
  <rect width="1080" height="1080" class="overlay" />
  <rect x="80" y="80" width="920" height="920" class="box" />
  
  <text x="140" y="150" class="brand-mark">US COLLEGE TRANSFER COMPASS</text>
  <text x="540" y="940" text-anchor="middle" class="footer-text">Why Essay Templates Fail</text>
  <text x="140" y="240" font-family='Outfit' font-weight="900" fill="#ffffff" font-size="34px">1. Never Write These Two</text>
  <text x="140" y="286" font-family='Outfit' font-weight="900" fill="#ffffff" font-size="34px">Things in Your &apos;Why Us&apos;</text>
  <text x="140" y="332" font-family='Outfit' font-weight="900" fill="#ffffff" font-size="34px">Essay</text>
  <circle cx="150" cy="384" r="5" class="bullet-dot" />
  <text x="180" y="393" class="card-body">❌ Generic brochure praise</text>
  <text x="180" y="439" class="card-body">(&apos;World-class professors and</text>
  <text x="180" y="485" class="card-body">beautiful library...&apos;).</text>
  <circle cx="150" cy="538" r="5" class="bullet-dot" />
  <text x="180" y="547" class="card-body">❌ Criticizing your current</text>
  <text x="180" y="593" class="card-body">college (&apos;My current school</text>
  <text x="180" y="639" class="card-body">is too small with no</text>
  <text x="180" y="685" class="card-body">resources...&apos;).</text>
  <circle cx="150" cy="738" r="5" class="bullet-dot" />
  <text x="180" y="747" class="card-body">⭕ Focus exclusively on</text>
  <text x="180" y="793" class="card-body">specific research papers by</text>
  <text x="180" y="839" class="card-body">their faculty, unique course</text>
  <text x="180" y="885" class="card-body">numbers, and academic</text>
  <text x="180" y="931" class="card-body">alignment.</text>
</svg>