  <text x="140" y="150" class="brand-mark">US COLLEGE TRANSFER COMPASS</text>
  <text x="540" y="940" text-anchor="middle" class="footer-text">The 3 Pillars of Transfer Essay</text>
  <text x="140" y="240" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="36px">3. 합격하는 편입 에세이의 3대 핵심 뼈대 공식</text>
  <circle cx="150" cy="311" r="5" class="bullet-dot" />
  <text x="180" y="320" class="card-body">1) 현재 성취: 열악한 전적대</text>
  <text x="180" y="364" class="card-body">환경 속에서도 내 전공 분야에서</text>
  <text x="180" y="408" class="card-body">일궈낸 최고의 학업적 노력.</text>
  <circle cx="150" cy="459" r="5" class="bullet-dot" />
  <text x="180" y="468" class="card-body">2) 오직 이 대학인 이유: 현</text>
