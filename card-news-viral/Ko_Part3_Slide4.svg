<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&amp;family=Outfit:wght@400;700;900&amp;display=swap');
      .brand-mark { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #c5a880; font-size: 24px; letter-spacing: 0.15em; }
      .card-title { font-family: 'Noto Sans KR', sans-serif; font-weight: 900; fill: #ffffff; font-size: 34px; line-height: 1.45; letter-spacing: -0.01em; }
      .card-subtitle { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; fill: #c5a880; font-size: 26px; letter-spacing: -0.01em; }
      .card-body { font-family: 'Noto Sans KR', sans-serif; font-weight: 500; fill: #e2e8f0; font-size: 26px; line-height: 1.65; }
      .footer-text { font-family: 'Noto Sans KR', 'Outfit', sans-serif; font-weight: 700; fill: #cbd5e1; font-size: 22px; }
      .overlay { fill: rgba(7, 10, 19, 0.88); }
      .box { fill: none; stroke: rgba(197, 168, 128, 0.35); stroke-width: 1.5; rx: 20px; }
      .bullet-dot { fill: #c5a880; }
    </style>
  </defs>

  <!-- Background Base64 Image -->
  <image href="file:///C:/Users/user/OneDrive/%EB%B0%94%ED%83%95%20%ED%99%94%EB%A9%B4/marketing_asset_writing_student.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
  
  <rect width="1080" height="1080" class="overlay" />
  <rect x="80" y="80" width="920" height="920" class="box" />
  
  <text x="140" y="150" class="brand-mark">US COLLEGE TRANSFER COMPASS</text>
  <text x="540" y="940" text-anchor="middle" class="footer-text">The 3 Pillars of Transfer Essay</text>
  <text x="140" y="240" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">3. 합격하는 편입 에세이</text>
  <text x="140" y="286" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">의 3대 핵심 뼈대 공식</text>
  <circle cx="150" cy="338" r="5" class="bullet-dot" />
  <text x="180" y="347" class="card-body">1) 현재 성취: 열악한 전적</text>
  <text x="180" y="393" class="card-body">대 환경 속에서도 내 전공</text>
  <text x="180" y="439" class="card-body">분야에서 일궈낸 최고의</text>
  <text x="180" y="485" class="card-body">학업적 노력.</text>
  <circle cx="150" cy="538" r="5" class="bullet-dot" />
  <text x="180" y="547" class="card-body">2) 오직 이 대학인 이유:</text>
  <text x="180" y="593" class="card-body">현 대학에서 더 이상 해결</text>
  <text x="180" y="639" class="card-body">할 수 없는 학문적 갈증을</text>
  <text x="180" y="685" class="card-body">목표 대학의 어떤 리소스</text>
  <text x="180" y="731" class="card-body">로 풀 것인가.</text>
  <circle cx="150" cy="784" r="5" class="bullet-dot" />
  <text x="180" y="793" class="card-body">3) 상호 기여: 내가 입학하</text>
  <text x="180" y="839" class="card-body">여 대학 공동체와 토론에</text>
  <text x="180" y="885" class="card-body">기여할 수 있는 고유한 배</text>
  <text x="180" y="931" class="card-body">경.</text>
</svg>