  <text x="140" y="240" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="36px">2. 명문 공대 편입 합격자들이 편입 전 대학에서 끝내는 과목</text>
  <circle cx="150" cy="311" r="5" class="bullet-dot" />
  <text x="180" y="320" class="card-body">명문 공대 편입 합격자들은</text>
  <text x="180" y="364" class="card-body">단순히 미적분학(Calculus II)</text>
  <text x="180" y="408" class="card-body">이수만으로 만족하지 않습니다.</text>
  <circle cx="150" cy="459" r="5" class="bullet-dot" />
  <text x="180" y="468" class="card-body">이들은 다변수</text>
  <text x="180" y="512" class="card-body">미적분학(Multivariable</text>
  <text x="180" y="556" class="card-body">Calculus), 선형대수학(Linear</text>
  <text x="180" y="600" class="card-body">Algebra),</text>
  <text x="180" y="644" class="card-body">미분방정식(Differential</text>
  <text x="180" y="688" class="card-body">Equations)은 기본으로</text>
