  <circle cx="150" cy="783" r="5" class="bullet-dot" />
  <text x="180" y="792" class="card-body">이에 더해 프로그래밍 과목,</text>
  <text x="180" y="836" class="card-body">대학 물리학(Calculus-based</text>
  <text x="180" y="880" class="card-body">Physics I and II)과</text>
  <text x="180" y="924" class="card-body">일반화학까지 완벽히 끝내 전공</text>
  <text x="180" y="968" class="card-body">역량을 증명합니다.</text>
  <text x="140" y="860" font-family="'Noto Sans KR', 'Outfit', sans-serif" font-weight="700" fill="#64748b" font-size="19px">📌 잊어버리기 전에 이 카드뉴스 저장하기</text>
