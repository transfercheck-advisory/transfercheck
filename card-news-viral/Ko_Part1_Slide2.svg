  <text x="140" y="286" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">(Required)&apos; 과목은 최하</text>
  <text x="140" y="332" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">위 조건입니다</text>
