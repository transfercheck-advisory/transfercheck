<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&amp;family=Outfit:wght@400;700;900&amp;display=swap');
      .brand-mark { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #c5a880; font-size: 24px; letter-spacing: 0.15em; }
      .card-title { font-family: 'Noto Sans KR', sans-serif; font-weight: 900; fill: #ffffff; font-size: 34px; line-height: 1.45; letter-spacing: -0.01em; }
      .card-subtitle { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; fill: #c5a880; font-size: 26px; letter-spacing: -0.01em; }
      .card-body { font-family: 'Noto Sans KR', sans-serif; font-weight: 500; fill: #e2e8f0; font-size: 26px; line-height: 1.65; }
      .footer-text { font-family: 'Noto Sans KR', 'Outfit', sans-serif; font-weight: 700; fill: #cbd5e1; font-size: 22px; }
      .overlay { fill: rgba(7, 10, 19, 0.88); }
      .box { fill: none; stroke: rgba(197, 168, 128, 0.35); stroke-width: 1.5; rx: 20px; }
      .bullet-dot { fill: #c5a880; }
    </style>
  </defs>

  <!-- Background Base64 Image -->
  <image href="file:///C:/Users/user/OneDrive/%EB%B0%94%ED%83%95%20%ED%99%94%EB%A9%B4/marketing_asset_campus_life.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
  
  <rect width="1080" height="1080" class="overlay" />
  <rect x="80" y="80" width="920" height="920" class="box" />
  
  <text x="140" y="150" class="brand-mark">US COLLEGE TRANSFER COMPASS</text>
  <text x="540" y="940" text-anchor="middle" class="footer-text">Business Transfer Killer EC</text>
  <text x="140" y="240" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">2. Business and Econom</text>
  <text x="140" y="286" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">ics (경영/경제) 킬러 E</text>
  <text x="140" y="332" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">C</text>
  <circle cx="150" cy="384" r="5" class="bullet-dot" />
  <text x="180" y="393" class="card-body">❌ 단순 모의 투자 대회 참</text>
  <text x="180" y="439" class="card-body">가, 경영학 요약 블로그 운</text>
  <text x="180" y="485" class="card-body">영은 탈락 대상.</text>
  <circle cx="150" cy="538" r="5" class="bullet-dot" />
  <text x="180" y="547" class="card-body">⭕ 학내 &apos;학생 투자 기금(</text>
  <text x="180" y="593" class="card-body">Student Investment Fund)</text>
  <text x="180" y="639" class="card-body">&apos;에 참여하여 실제 자금 포</text>
  <text x="180" y="685" class="card-body">트폴리오 자산 운용.</text>
  <circle cx="150" cy="738" r="5" class="bullet-dot" />
  <text x="180" y="747" class="card-body">⭕ 로컬 소상공인의 재무제</text>
  <text x="180" y="793" class="card-body">표(P and L)를 분석해 실질</text>
  <text x="180" y="839" class="card-body">적 비용 절감 솔루션을 제</text>
  <text x="180" y="885" class="card-body">안한 재무 컨설팅 프로젝트</text>
  <text x="180" y="931" class="card-body">.</text>
  <circle cx="150" cy="984" r="5" class="bullet-dot" />
  <text x="180" y="993" class="card-body">⭕ Harvard Business Revi</text>
  <text x="180" y="1039" class="card-body">ew 케이스 스터디 학회를</text>
  <text x="180" y="1085" class="card-body">조직하여 정기 토론회 리드</text>
  <text x="180" y="1131" class="card-body">.</text>
</svg>