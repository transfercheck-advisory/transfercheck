  <!-- Background Base64 Image -->
  <image href="file:///C:/Users/user/OneDrive/%EB%B0%94%ED%83%95%20%ED%99%94%EB%A9%B4/marketing_asset_writing_student.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
  
  <rect width="1080" height="1080" class="overlay" />
  <rect x="80" y="80" width="920" height="920" class="box" />
  
  <text x="140" y="150" class="brand-mark">US COLLEGE TRANSFER COMPASS</text>
  <text x="540" y="940" text-anchor="middle" class="footer-text">Why Essay Templates Fail</text>
  <text x="140" y="240" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">1. &apos;왜 이 대학인가&apos;에</text>
  <text x="140" y="286" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">절대 쓰지 말아야 할 두</text>
  <text x="140" y="332" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">가지</text>
  <circle cx="150" cy="384" r="5" class="bullet-dot" />
  <text x="180" y="393" class="card-body">❌ 학교 웹사이트 브로셔</text>
  <text x="180" y="439" class="card-body">문구를 베낀 칭찬 (&apos;훌륭한</text>
  <text x="180" y="485" class="card-body">교수진과 웅장한 도서관.</text>
  <text x="180" y="531" class="card-body">..&apos;)</text>
  <circle cx="150" cy="584" r="5" class="bullet-dot" />
