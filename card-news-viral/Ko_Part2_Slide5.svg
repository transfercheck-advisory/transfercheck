  <!-- Background Base64 Image -->
  <image href="file:///C:/Users/user/OneDrive/%EB%B0%94%ED%83%95%20%ED%99%94%EB%A9%B4/marketing_asset_campus_life.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
  
  <rect width="1080" height="1080" class="overlay" />
  <rect x="80" y="80" width="920" height="920" class="box" />
  
  <text x="140" y="150" class="brand-mark">US COLLEGE TRANSFER COMPASS</text>
  <text x="540" y="940" text-anchor="middle" class="footer-text">상세 정보는 본문 캡션 및 프로필 링크 확인 👇</text>
  <text x="140" y="240" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">나에게 어울리는 스펙을</text>
  <text x="140" y="286" font-family='Noto Sans KR' font-weight="900" fill="#ffffff" font-size="34px">진단하려면?</text>
  <circle cx="150" cy="338" r="5" class="bullet-dot" />
  <text x="180" y="347" class="card-body">전공별 합격생들의 실제 포</text>
  <text x="180" y="393" class="card-body">트폴리오 데이터와 매칭하</text>
  <text x="180" y="439" class="card-body">여 경쟁력 있는 활동 로드</text>
