  <text x="180" y="393" class="card-body">[Calculus I -&gt; Physics I</text>
  <text x="180" y="439" class="card-body">-&gt; Physics II]로 연결되</text>
  <text x="180" y="485" class="card-body">는 연계 구조에서 미적분학</text>
